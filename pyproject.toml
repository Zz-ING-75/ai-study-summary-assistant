[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "study-summary-evaluator"
version = "0.1.0"
description = "使用DeepSeek生成学习摘要，并通过DeepEval自动评测。"
requires-python = ">=3.10"
dependencies = [
  "deepeval>=3.7",
  "openai>=1.68",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
